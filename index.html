<body><div class="shell"><aside class="side"><div class="brand"><div class="brandmark">∑</div><div><strong>MATHEMATICA</strong><small>THE MATHEMATICAL MIND LAB</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">A laboratory for patient thinking.<br><b>Curiosity is the curriculum.</b></div></aside><main class="main"><header class="top"><div class="crumb">MATHEMATICA <span style="color:#b3bbb5"> / </span> <b id="crumb">Overview</b></div><div class="topright"><select id="courseSwitcher" class="switch" aria-label="Active course" onchange="switchCourse(this.value)"></select><button class="switch" id="theme">◐ &nbsp; Appearance</button><span class="date" id="today"></span><div class="avatar">MM</div></div></header><div class="content" id="view"></div></main></div>
<script src="src/storage.js"></script><script src="data/courses.js"></script><script src="src/course-engine.js"></script><script src="src/course-ui.js"></script><script src="src/mathematical-engine.js"></script><script src="src/exam-engine.js"></script><script src="src/biology-lab.js"></script><script src="src/date-utils.js"></script>
<script>
const modules=[
['Mathematical Foundations','Vectors, coordinates, dot products, length and angles.','Represent genotype counts as vectors; allele-frequency vectors summarize population variation.','Visualize vectors and angles; compute dot products and norms.','Read Strang, Introduction to Linear Algebra, chapters 1–2 (edition-dependent). Start MIT 18.06SC lectures 1–3.','Checkpoint: explain geometrically why the dot product detects orthogonality.'],
['Vector Spaces','Span, linear combinations, subspaces, basis, dimension and independence.','Genetic profiles as points in a feature space; basis choices change representation.','Explore spans in R²/R³ and test independence.','Strang, chapters 2–3. Axler, Linear Algebra Done Right, chapters 1–2.','Checkpoint: find a basis and justify its dimension.'],
['Matrix Fundamentals','Operations, multiplication, transpose, inverse, rank, row and column spaces.','Expression matrices arrange genes by samples; rank captures redundant measurements.','Build a matrix and compare its row and column spaces.','Strang, chapters 2–3. MIT 18.06SC lectures 3–6.','Checkpoint: interpret matrix multiplication as composition.'],
['Systems of Linear Equations','Ax=b, elimination, pivots, LU and consistency.','Estimate mixture proportions or solve constrained measurement equations.','Row reduce systems and identify free variables.','Strang, chapters 1–2. MIT 18.06SC lectures 2–4.','Checkpoint: classify a system by its pivots and augmented column.'],
['Linear Transformations','Matrix representations, kernel, image, composition and change of basis.','Linear maps model transformations between measured biological feature spaces.','Transform the unit square and inspect kernel/image.','Strang, chapters 6–7. MIT 18.06SC lectures 8–10.','Checkpoint: use rank-nullity and state what the dimensions mean.'],
['Determinants','Area and volume scaling, invertibility and determinant properties.','A zero determinant signals collapsed dimensions in a linear transformation.','Observe signed area scaling as matrix entries change.','Strang, chapter 5. MIT 18.06SC lectures 16–17.','Checkpoint: connect determinant, volume scale and invertibility.'],
['Eigenvalues and Eigenvectors','Characteristic polynomial, eigenvalues, eigenspaces and geometry.','Eigenvectors reveal directions preserved by population transition models.','Move a matrix and watch invariant directions.','Strang, chapters 5–6. MIT 18.06SC lectures 21–23.','Checkpoint: interpret Av=λv without relying on computation alone.'],
['Diagonalization and Dynamics','Diagonalization, powers, discrete dynamics and stability.','Transition matrices describe repeated generations in simplified models.','Iterate a state vector and compare dominant modes.','Strang, chapter 6. MIT 18.06SC lectures 24–25.','Checkpoint: relate dominant eigenvalues to long-term behavior.'],
['Inner Product Spaces','Orthogonality, orthogonal bases, Gram–Schmidt and projection.','Orthogonal directions simplify separating signal from residual variation.','Project points onto a line or plane.','Strang, chapters 4 and 6. MIT 18.06SC lectures 14–15.','Checkpoint: calculate a projection and verify the residual is orthogonal.'],
['Least Squares','Overdetermined systems, normal equations and regression foundations.','Fit expression trends when measurements outnumber model parameters.','Compare residuals and fitted values.','Strang, chapter 4. MIT 18.06SC lectures 16–18.','Checkpoint: derive AᵀAx=Aᵀb and explain its geometry.'],
['Symmetric Matrices and Quadratic Forms','Spectral theorem, quadratic forms, positive definiteness and covariance.','Covariance matrices summarize paired variation across genes or variants.','Inspect eigenvectors of a covariance matrix.','Strang, chapters 5–6. MIT 18.06SC lectures 21–23.','Checkpoint: explain why symmetric matrices admit orthogonal eigenvectors.'],
['Singular Value Decomposition','SVD, matrix factorization, low-rank approximation and compression.','SVD supports denoising and compact representations of expression datasets.','Reconstruct a matrix using its largest singular components.','Strang, Linear Algebra and Learning from Data, chapters 1–2. MIT 18.065 lectures 1–4.','Checkpoint: describe the geometric actions of U, Σ and Vᵀ.'],
['Principal Component Analysis','Centering, covariance, components, explained variance and limitations.','Explore population structure from simulated genotype matrices, with confounding caveats.','Center features, compute components and compare scaling.','Strang, Linear Algebra and Learning from Data, PCA chapters. MIT 18.065 lectures 5–8.','Checkpoint: explain what PCA optimizes and what PCs do not prove.'],
['Graph Theory and Matrix Representations','Adjacency, degree, Laplacian, connectivity and spectral foundations.','Protein interaction and neural connectivity networks can be represented by matrices.','Construct a graph Laplacian and inspect connected components.','Strang, Linear Algebra and Learning from Data, graph chapters. 18.065 spectral methods lectures.','Checkpoint: explain how Laplacian eigenvalues relate to connectivity.'],
['Computational Linear Algebra','Floating point, stability, sparse matrices, decompositions and efficiency.','Large genomic matrices require careful numerical methods and reproducible pipelines.','Compare dense and sparse operations on small examples.','MIT 18.065 lectures on numerical linear algebra and randomized methods.','Checkpoint: distinguish conditioning from algorithmic stability.'],
['Integration and Capstone Preparation','Synthesize linear algebra, biological case studies and research planning.','Develop a reproducible population-structure investigation with explicit limitations.','Select a question, audit a dataset and plan the analysis.','Review Strang and MIT 18.06/18.065; consult original genomic study sources.','Checkpoint: submit a defensible research plan with assumptions and milestones.']
];
const topics=['Vectors','Matrix calculations','Linear systems','Eigenvalues','Projections','Population genetics','PCA','Determinants'];
const navgroups=[['LEARN',[['home','⌂','Overview'],['academy','▤','Academy'],['arena','◎','Problem Arena'],['daily','◷','Daily Mathematics']]],['EXPLORE',[['lab','⌘','Biological Laboratory'],['playground','◌','Mathematical Playground'],['research','⌕','Research Observatory']]],['BUILD',[['studio','▧','Research Studio'],['progress','▥','Progress & Records']]]];
const initialLoad=window.initialLoad=MathStorage.load(MathStorage.read('mathematica-v3'),MathStorage.read('mathematica-v2'),MathStorage.read('mathematica-v1'));let platformState=CourseEngine.normalize(initialLoad.data),activeCourseId=platformState.activeCourseId,state=platformState.courses[activeCourseId];state.dark=platformState.preferences.dark;let page='home',currentProblem=null,moduleOpen=-1,caseOpen=0,arenaMode='Practice';
function save(){MathStorage.save(platformState)}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function setPage(p){page=p;render()}function day(){return MathDates.dateKey(new Date(),platformState.preferences.timeZone||MathDates.DEFAULT_TIME_ZONE)}function recordDay(){state.activeDays[day()]=true;save()}
function nav(){document.getElementById('nav').innerHTML=navgroups.map(g=>`<div class="nav-label">${g[0]}</div>${g[1].map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')"><span class="ico">${ic}</span><span class="label">${n}</span></button>`).join('')}`).join('')}
function heading(k,t,d,action=''){return `<div class="hello"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="sub">${d}</div></div>${action}</div>`}
function metric(l,v,n){return `<div class="metric"><div class="lab">${l}</div><div class="val">${v}</div><div class="note">${n}</div></div>`}
function solvedPct(){return Math.round(state.solved.length/512*100)}
function render(){document.body.classList.toggle('dark',state.dark);document.getElementById('today').textContent=new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'numeric'}).format(new Date());document.getElementById('crumb').textContent=({home:'Overview',academy:'Academy',arena:'Problem Arena',daily:'Daily Mathematics',lab:'Biological Laboratory',playground:'Mathematical Playground',research:'Research Observatory',studio:'Research Studio',progress:'Progress & Records'})[page];nav();const root=document.getElementById('view');root.innerHTML=views[page]();if(page==='playground')computePlay();if(page==='daily')drawWeek();}
const views={home:()=>`${heading('Sunday, November 8 · Your laboratory','Make room for a good question.','A steady practice in mathematical thinking, connected to the living world.')}
<div class="grid metrics">${metric('PROBLEM BANK',state.solved.length+' / 512',solvedPct()+'% verified problems solved')}${metric('PROBLEMS SOLVED',state.solved.length,'of 512 verified practice problems')}${metric('PRACTICE STREAK',streak()+' days','Consistency over speed')}${metric('RESEARCH NOTES',state.papers.length,'Saved to your reading list')}</div>
<div class="grid dashboardgrid"><div class="card continue"><div class="eyebrow">CONTINUE LEARNING · MODULE 01</div><h2>Vectors, as a language for direction</h2><p>Start with geometric intuition, then connect dot products and vector length to biological measurements.</p><div class="progressline"><i style="width:${solvedPct()}%"></i></div><div class="progressmeta"><span>Verified practice bank · ${solvedPct()}% solved</span><span>~35 min</span></div><button class="btn" onclick="setPage('academy')">Open the academy →</button></div>
<div class="card daily"><div class="cardhead"><div><div class="eyebrow">TODAY'S MATHEMATICS</div><h2>A small puzzle, whenever you're ready</h2></div><span class="tag">2 MIN</span></div><div class="puzzle">What is the dot product of <b>(2, −1)</b> and <b>(3, 4)</b>? What does its sign tell you about the angle?</div><button class="btn primary" onclick="setPage('daily')">Try today's puzzle →</button></div></div>
<div class="grid featuregrid">${[['arena','◎','Random problem','Practice one of 512 verified exercises, with hints when you need them.'],['lab','⌘','Biological challenge','Explore mathematical models of genes, populations and neural systems.'],['research','⌕','Research observatory','Start with verified open course materials and scholarly discovery.'],['studio','▧','Capstone progress','Plan a PCA investigation with a research journal and milestones.']].map(x=>`<div class="card feature" onclick="setPage('${x[0]}')"><div class="featureicon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div>
<div class="sectiontitle"><h2>Your course pathway</h2><button class="btn sm" onclick="setPage('academy')">View 16 modules →</button></div><div class="list">${modules.slice(0,4).map((m,i)=>`<div class="row module" onclick="setPage('academy');moduleOpen=${i};render()"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="grow"><strong>${m[0]}</strong><small>${m[1]}</small></div><span class="tag">${i===0?'START HERE':'UP NEXT'}</span></div>`).join('')}</div>`,
academy:()=>`${heading('Course 01 · Linear algebra','A 16-week course, built for understanding','Each module combines geometric intuition, formal reasoning, computation, and a biological lens.')}
<div class="notice">Prerequisites: comfort with high-school algebra. Return to any topic freely. Mastery comes from solving and explaining, not ticking lessons off.</div><div class="grid metrics">${metric('MODULES','16','University-level sequence')}${metric('PROBLEM BANK','512','Original, parameterized problems')}${metric('CASE STUDIES','18','Simulated biological examples')}${metric('COURSE FORMAT','Local first','Your records stay in this browser')}</div><div class="sectiontitle"><h2>Curriculum</h2><span class="sub">Select a module to expand its learning plan</span></div><div class="list">${modules.map((m,i)=>`<div class="card module" style="padding:0"><div class="row" style="border:0;background:transparent" onclick="moduleOpen=moduleOpen===${i}?-1:${i};render()"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="grow"><strong>${m[0]}</strong><small>${m[1]}</small></div><span class="tag">${moduleStatus(i).toUpperCase()}</span><span class="arrow">${moduleOpen===i?'−':'+'}</span></div>${moduleOpen===i?`<div class="moduledetail"><p><b>Learning state:</b> ${moduleStatus(i)} · Completed after 5 distinct correct problems; Mastered after 8 distinct correct problems on at least 3 days with at least 80% accuracy across recorded attempts.</p><p><b>Mapped practice:</b> Use the related topic family in the Problem Arena, then return here. These thresholds are practice evidence, not a claim of research competence.</p><p><b>Biological connection:</b> ${m[2]}</p><p><b>Learn by doing:</b> ${m[3]}</p><p><b>Reading:</b> ${m[4]}</p><div class="notice"><b>Mastery checkpoint:</b> ${m[5]}</div><p><b>Independent practice:</b> Open the Problem Arena and filter by ${moduleFamilies[i]===null?'any topic':topics[moduleFamilies[i]].toLowerCase()}. Record a short explanation in your notes.</p><button class="btn primary sm" onclick="setPage('arena')">Practice this module →</button></div>`:''}</div>`).join('')}</div>`,
arena:()=>`${heading('Problem Arena · 512 verified exercises','The work is yours. The hints are here.','Eight deterministic problem families × 64 distinct parameter settings. Answers are checked against the exact generated solution.')}<div class="grid two"><div class="card"><div class="cardhead"><div><div class="eyebrow">PRACTICE MODE</div><h2>Choose a way into the problem</h2></div><span class="tag">${state.solved.length} COMPLETED</span></div><div class="inline-actions">${['Practice','Timed','Random','Mistake review'].map(x=>`<button class="btn sm ${arenaMode===x?'primary':''}" onclick="arenaMode='${x}';render()">${x}</button>`).join('')}</div><button class="btn sm" style="margin-top:8px" onclick="setPage('exam')">Configure a full exam →</button><div class="formrow"><select class="field" id="topicFilter"><option value="">All topics</option>${topics.map(t=>`<option>${t}</option>`).join('')}</select><select class="field" id="levelFilter"><option value="">All levels</option>${Array.from({length:9},(_,i)=>`<option value="${i+1}">Level ${i+1}</option>`).join('')}</select></div><div class="divider"></div><div class="inline-actions"><button class="btn primary" onclick="nextProblem()">${arenaMode==='Random'?'Surprise me':'Give me a problem'} →</button><span class="sub">No solution until you ask for it.</span></div></div><div class="card"><div class="eyebrow">PROBLEM BANK</div><h2>Eight families, 512 exact-answer problems</h2><p class="sub">Every problem is generated from integer parameters with a known answer. No duplicate prompts; the fixed parameter sets make practice reproducible.</p><div>${topics.map((t,i)=>`<span class="chip">${t} · 64</span>`).join('')}</div><div class="divider"></div><div class="sub">Levels 1–9 · computation to research reasoning<br>Generated in browser; history saved locally.</div></div></div><div id="problemSlot" style="margin-top:15px"></div>`,
daily:()=>`${heading('Daily Mathematics · Chess mode','One question. A little time well spent.','A daily habit with no penalty for missed days. Choose a quick-play length or revisit your mistakes.') }<div class="grid two"><div class="card"><div class="eyebrow">TODAY · VECTOR CALCULUS</div><h2>Orthogonality at a glance</h2><div class="problem">What is the dot product of <b>(2, −1)</b> and <b>(3, 4)</b>? What does its sign tell you about the angle between the vectors?</div><div class="formrow"><input id="dailyAnswer" class="field answer" placeholder="Your answer, with a short interpretation"><button class="btn primary" onclick="checkDaily()">Check</button></div><div id="dailyState" class="answerstate"></div><button class="btn sm" style="margin-top:10px" onclick="document.getElementById('dailySolution').classList.toggle('show')">Show explanation</button><div class="solution" id="dailySolution">The dot product is 2·3 + (−1)·4 = 2. Since it is positive, the angle is acute (the vectors are not orthogonal). In general u·v=‖u‖‖v‖cos θ.</div></div><div class="card"><div class="eyebrow">QUICK PLAY</div><h2>Set a gentle timer</h2><p class="sub">Pick a session length. Pause or stop whenever you like.</p><div class="inline-actions">${[2,5,10,15].map(n=>`<button class="btn sm" onclick="startTimer(${n})">${n} min</button>`).join('')}</div><div class="divider"></div><div id="timer" class="mono">Ready when you are.</div><div class="sectiontitle"><h3>This week's rhythm</h3></div><div id="week" class="inline-actions"></div><p class="sub" style="margin-top:15px">Every bit of practice counts. Rest is part of learning too.</p></div></div><div class="grid two" style="margin-top:15px"><div class="card"><div class="eyebrow">SPACED REPETITION</div><h2>Mistakes make a useful map</h2><p class="sub">Problems you miss are saved here to revisit later.</p><div class="inline-actions"><button class="btn" onclick="arenaMode='Mistake review';setPage('arena')">Review ${state.wrong.length} saved mistakes</button><button class="btn" onclick="nextProblem()">Random practice</button></div></div><div class="card"><div class="eyebrow">MISTAKE NOTEBOOK</div><h2>Your recurring notes</h2><textarea class="field full" id="mistakeNote" placeholder="Write a pattern you noticed or a corrected solution…" oninput="state.notes=this.value;save()">${esc(state.notes)}</textarea></div></div>`,
lab:()=>`${heading('Biological Laboratory','A mathematical model is a useful lens','All built-in numerical examples are simulated. Interpretations are hypotheses to examine, not biological mechanisms proved by a matrix.') }<div class="notice">Data provenance: the case study prompts below use explicitly simulated toy data until you import a public dataset. Simulations are for learning and do not represent real populations or experiments.</div><div class="sectiontitle"><h2>Case studies</h2><span class="sub">18 investigations · select one to open</span></div><div class="grid two">${cases.map((c,i)=>`<div class="card module" onclick="caseOpen=caseOpen===${i}?-1:${i};render()"><div class="cardhead"><div><div class="eyebrow">${c[0]}</div><h3>${c[1]}</h3></div><span class="tag">SIMULATED</span></div><p class="sub">${c[2]}</p>${caseOpen===i?`<div class="moduledetail" style="padding:0"><div class="divider"></div><p><b>Question:</b> ${c[3]}</p><p><b>Representation:</b> ${c[4]}</p><p><b>Your turn:</b> ${c[5]}</p><p><b>Hint:</b> Start with dimensions and units; inspect a tiny example before interpreting a real dataset.</p><p><b>Limitations:</b> This simplified setup omits biological complexity, sampling uncertainty, and confounding. A pattern in the model does not establish causation.</p><label class="sub">Your working</label><textarea class="field full" placeholder="Sketch calculations or interpretation…" oninput="saveCase(${i},this.value)">${esc((state['case'+i]||''))}</textarea></div>`:''}</div>`).join('')}</div>`,
playground:()=>`${heading('Mathematical Playground','Change a matrix. Watch what it does.','A small, offline sandbox for transformations, rank, determinant, eigenvalues and vector movement.') }<div class="grid two"><div class="card"><div class="eyebrow">2 × 2 TRANSFORMATION</div><h2>Matrix and input vector</h2><p class="sub">Enter four matrix entries and a vector. See where the unit square corners and your vector land.</p><div class="formrow"><input class="field mat" value="2" aria-label="a"><input class="field mat" value="1" aria-label="b"><input class="field mat" value="1" aria-label="c"><input class="field mat" value="2" aria-label="d"></div><div class="formrow"><input class="field vec" value="1" aria-label="x"><input class="field vec" value="1" aria-label="y"><button class="btn primary" onclick="computePlay()">Transform →</button></div><div id="playResult" class="notice" style="margin-top:16px">Edit the entries, then transform.</div></div><div class="card"><div class="eyebrow">LIVE GEOMETRY</div><h2>Unit square under A</h2><canvas id="plot" width="500" height="320" style="width:100%;height:auto"></canvas><p class="sub">The quadrilateral shows the transformed unit square. The signed area scale equals det(A).</p></div></div><div class="grid three" style="margin-top:15px"><div class="card"><h3>Eigenvectors</h3><p class="sub">For a symmetric 2×2 matrix, directions along eigenvectors are preserved up to scaling. Observe how the grid and axes move.</p></div><div class="card"><h3>Projections</h3><p class="sub">Project x onto a nonzero vector u with (x·u)/(u·u) u. The residual is perpendicular to u.</p></div><div class="card"><h3>PCA</h3><p class="sub">Center observations first. Principal axes maximize variance, but can reflect sampling design and batch effects as well as structure.</p></div></div>`,
research:()=>`${heading('Research Observatory','Follow methods back to their sources','Research discovery is designed to be honest: verified foundational links, no fabricated paper records, and a manual import path for papers you choose.') }<div class="notice">Current release: no live scholarly API is connected. The entries below are primary course materials, not claimed recent research articles. Import a paper with its DOI or verified URL to keep a reading record.</div><div class="sectiontitle"><h2>Foundational source library</h2><span class="sub">Links point to original publishers or course hosts</span></div><div class="list">${sources.map(s=>`<div class="row"><span class="num">↗</span><div class="grow"><strong>${s[0]}</strong><small>${s[1]}</small></div><a class="btn sm" href="${s[2]}" target="_blank" rel="noopener">Open source ↗</a></div>`).join('')}</div><div class="grid two" style="margin-top:15px"><div class="card"><div class="eyebrow">PERSONAL READING LIST</div><h2>Import a paper</h2><p class="sub">Enter metadata from the original record. The app does not verify DOI metadata offline.</p><input class="field full" id="paperTitle" placeholder="Paper title"><div class="formrow"><input class="field" id="paperAuthors" placeholder="Authors"><input class="field" id="paperDate" placeholder="Year / date"></div><div class="formrow"><input class="field answer" id="paperDoi" placeholder="DOI or URL"><button class="btn primary" onclick="addPaper()">Save paper</button></div><div id="paperMsg" class="answerstate"></div></div><div class="card"><div class="eyebrow">MATHEMATICAL DEBATES</div><h2>Methods have tradeoffs</h2><p class="sub"><b>PCA vs random projection:</b> PCA gives variance-ranked directions that can be interpretable; random projections preserve pairwise geometry approximately at lower computation cost, but do not rank variance directions.</p><p class="sub"><b>Dense vs sparse:</b> dense linear algebra is often fast for compact matrices; sparse methods save memory when zeros dominate, with overhead and convergence tradeoffs.</p><p class="sub"><b>Linear vs nonlinear reduction:</b> linear methods are transparent and efficient; nonlinear embeddings can expose curved structure but may distort global distances and depend on tuning.</p></div></div><div class="sectiontitle"><h2>Saved reading list</h2></div><div class="list">${state.papers.length?state.papers.map((p,i)=>`<div class="row"><div class="grow"><strong>${esc(p.title)}</strong><small>${esc(p.authors)} · ${esc(p.date)} · ${esc(p.doi)}</small></div><button class="btn sm" onclick="removePaper(${i})">Remove</button></div>`).join(''):'<div class="card empty">No papers saved yet. Your imported citations are stored in this browser.</div>'}</div>`,
studio:()=>`${heading('Research Studio · Capstone','Recovering Genetic Population Structure Through Linear Algebra','A guided PCA investigation. Begin with simulated data; move to public genotype data only when you can document consent, provenance, and limitations.') }<div class="notice">The capstone is a learning project. It does not automatically imply publishability or replace supervised research. All work and claims remain yours to validate.</div><div class="grid metrics">${metric('PROJECT MILESTONES',Object.values(state.milestones).filter(Boolean).length+' / 8','A research path, not a race')}${metric('JOURNAL ENTRIES',state.journalCount||0,'Written in your local journal')}${metric('DATASET','Not selected','Choose and record provenance')}${metric('STATUS','Planning','Start with a testable question')}</div><div class="grid two"><div class="card"><div class="eyebrow">MILESTONE TRACKER</div><h2>From question to report</h2>${['Research question and background','Mathematical foundation','Dataset and provenance audit','Reproducible PCA implementation','Visualizations and results','Critical analysis and limitations','Written report with references','Poster and short presentation'].map((x,i)=>`<label class="row" style="cursor:pointer"><input type="checkbox" ${state.milestones[i]?'checked':''} onchange="state.milestones[${i}]=this.checked;save();render()"><span class="grow"><strong>${x}</strong><small>Phase ${i+1}</small></span></label>`).join('')}</div><div class="card"><div class="eyebrow">RESEARCH JOURNAL</div><h2>Keep a record of decisions</h2><p class="sub">Record questions, assumptions, code versions, and reasons for analysis choices.</p><textarea id="journal" class="field full" style="min-height:250px" placeholder="Date · question · decision · what I expect to observe…" oninput="state.journal=this.value;save()">${esc(state.journal||'')}</textarea><div class="formrow"><button class="btn" onclick="exportJournal()">Export journal</button><button class="btn" onclick="downloadRecords()">Backup all records</button></div><div class="divider"></div><h3>Project rubric</h3><p class="sub">Mathematical correctness · biological interpretation · reproducibility · critical thinking · scientific writing. Explain sample composition, SNP selection, scaling, population labels, and what PCA cannot infer.</p></div></div><div class="card" style="margin-top:15px"><div class="eyebrow">CAPSTONE WORKFLOW</div><div class="grid three"><div><h3>1 · Formulate</h3><p class="sub">Define population structure and state what a PC can and cannot tell you.</p></div><div><h3>2 · Compute</h3><p class="sub">Build a samples × variants genotype matrix. Center, consider standardization, compare covariance eigendecomposition with SVD.</p></div><div><h3>3 · Critique</h3><p class="sub">Examine sample balance, variant filtering, missingness, stratification, and alternative explanations.</p></div></div><p class="sub">Potential public source: <a href="https://www.internationalgenome.org/" target="_blank" rel="noopener">1000 Genomes Project</a>. Access route and terms vary by dataset; cite the exact files and release you use.</p></div>`,
progress:()=>`${heading('Progress & Records','A clear picture of practice','Progress reflects problems and deliberate work. Time spent alone is not a measure of mastery.') }<div class="grid metrics">${metric('PROBLEMS SOLVED',state.solved.length,'Unique generated exercises')}${metric('ACCURACY',accuracy()+'%',state.solved.length+' correct submissions')}${metric('PRACTICE MINUTES',state.minutes,'Self-directed time')}${metric('ACTIVE DAYS',Object.keys(state.activeDays).length,'No penalty for gaps')}</div><div class="grid two"><div class="card"><div class="eyebrow">MASTERY SIGNALS</div><h2>Practice by topic</h2>${topics.map((t,i)=>{let n=state.solved.filter(id=>id.startsWith('P'+i+'-')).length;return `<div style="margin:16px 0"><div class="inline-actions" style="justify-content:space-between;margin-bottom:6px"><span>${t}</span><span class="mono">${n} completed</span></div><div class="progressbar"><i style="width:${Math.min(100,n/64*100)}%"></i></div></div>`}).join('')}</div><div class="card"><div class="eyebrow">WEEKLY ACTIVITY</div><h2>Show up when you can</h2><div class="chart">${weekDates().map(d=>`<div class="bar" style="height:${state.activeDays[d]?82:8}%"><span>${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</span></div>`).join('')}</div><div class="divider"></div><div class="sub">Mistakes saved: ${state.wrong.length} · Case studies opened: ${Object.keys(state).filter(k=>k.startsWith('case')).length} · Papers saved: ${state.papers.length}</div><div class="formrow"><button class="btn" onclick="downloadRecords()">Export learning records</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" accept="application/json" hidden onchange="restoreRecords(event)"></label></div></div></div><div class="card" style="margin-top:15px"><div class="eyebrow">LEARNING GRAPH</div><h2>Linear algebra now; a broader path later</h2><p class="sub">Linear Algebra → Calculus → Probability → Statistics → Differential Equations → Discrete Mathematics → Optimization → Mathematical Biology. Future courses are represented as a roadmap; their full learning materials are not yet authored.</p>${['Linear Algebra','Calculus','Probability','Statistics','Differential Equations','Discrete Mathematics','Optimization','Mathematical Biology'].map((x,i)=>`<span class="chip">${String(i+1).padStart(2,'0')} · ${x}</span>`).join('')}</div>`};
const cases=[['POPULATION GENETICS','Genotype data as a matrix','Simulated diploid genotype counts for 6 individuals at 4 loci.','How do sample and variant dimensions shape a genotype matrix?','Rows represent samples; columns represent variants; entries are 0, 1, or 2.','Write the matrix shape and one sample vector.'],['POPULATION GENETICS','Allele-frequency vectors','Toy counts at three biallelic loci.','How do allele frequencies summarize a sample?','At each locus, count allele copies and divide by twice the number of diploid samples.','Compute a frequency for counts 4, 7, 9 out of 20 chromosomes.'],['POPULATION GENETICS','Covariance between variants','Simulated paired variant measurements.','Do two variants tend to vary together in this toy sample?','Center columns and inspect cross-products; sampling uncertainty matters.','Calculate a small 2×2 sample covariance by hand.'],['POPULATION GENETICS','Genetic similarity as vectors','Three short simulated genotype profiles.','Which pair of profiles is closest under Euclidean distance?','Treat each profile as a vector and compare distances.','Compute squared distances; remember distance is not ancestry itself.'],['POPULATION GENETICS','PCA on genotype data','Simulated 2-cluster genotype matrix, deliberately simple.','What directions capture the largest centered variation?','Center columns; use SVD or covariance eigenvectors.','Sketch which feature contributes most variance.'],['POPULATION GENETICS','Population structure and clustering','Toy samples with labels assigned for demonstration.','Do plotted components align with the labels in this simulation?','Compare within-label and between-label variation.','Ask how labels and sampling choices were generated.'],['POPULATION GENETICS','Genetic drift as a transition model','Illustrative 2-state transition matrix, not a fitted model.','What happens after several repeated transitions?','Multiply a state vector by a transition matrix iteratively.','Check that probability entries remain nonnegative and sum to one.'],['POPULATION GENETICS','Limitations of PCA for ancestry','Simulated mixture, batch shift, and uneven sampling scenario.','Which alternative causes could create a visible PC cluster?','PCA ranks variance; it does not label its cause.','List sample composition, LD, missingness, and technical effects.'],['MOLECULAR BIOLOGY','Gene expression matrix','Simulated expression for 5 genes across 4 samples.','Which gene varies most across the toy samples?','Rows are genes and columns samples here; state convention explicitly.','Compute each row mean and variance.'],['MOLECULAR BIOLOGY','Compare expression profiles','Simulated gene vectors on a common scale.','Which pair of sample profiles are most similar?','Compare cosine similarity and Euclidean distance; scaling changes answers.','Center or standardize only when justified.'],['MOLECULAR BIOLOGY','Transcriptomics and dimension reduction','Toy matrix with many features and few samples.','Why can low-rank representation be useful?','SVD gives a best rank-k approximation in Frobenius norm.','Compare residual error as k increases.'],['MOLECULAR BIOLOGY','Protein interaction network','Small simulated undirected adjacency matrix.','Which node has the highest degree?','For an undirected unweighted graph, row sums give degrees.','Inspect whether diagonal entries are zero.'],['EVOLUTIONARY BIOLOGY','Evolutionary transition matrices','Illustrative discrete state transitions.','What is the equilibrium distribution if one exists?','Solve πT=π with entries summing to one.','A simplified transition matrix is not itself an evolutionary explanation.'],['EVOLUTIONARY BIOLOGY','Discrete population-state dynamics','A small linear recurrence with chosen coefficients.','Which modes grow, decay, or persist?','Compute eigenvalues and compare their magnitudes to 1.','The model is only valid under its stated linear assumptions.'],['EVOLUTIONARY BIOLOGY','Stability of a linear system','Toy 2D update matrix.','Do perturbations shrink after repeated updates?','Inspect spectral radius and iterate small perturbations.','Distinguish local model stability from biological stability.'],['NEUROSCIENCE','Neural connectivity matrix','Simulated weighted connections among four units.','How does activity propagate in one update?','Multiply a connectivity matrix by a population activity vector.','State convention: rows receive or send activity.'],['NEUROSCIENCE','Simplified neural population activity','Toy activity matrix across units and time points.','Which activity pattern explains the largest variation?','Center time points and examine leading singular vectors.','This is a descriptive model, not neural mechanism evidence.'],['NEUROSCIENCE','Covariance between neural signals','Simulated paired signals over six time bins.','Are two units co-varying in this simulation?','Calculate covariance and discuss dependence on time window.','Correlation does not establish direct connectivity.']];
const sources=[['Introduction to Linear Algebra · Gilbert Strang','Wellesley-Cambridge Press · use the edition available to you; chapter numbering varies.','https://math.mit.edu/~gs/linearalgebra/'],['MIT 18.06SC · Linear Algebra','MIT OpenCourseWare · Fall 2011 self-contained course materials.','https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/'],['Essence of Linear Algebra · 3Blue1Brown','Visual series · vectors, transformations, eigenvectors and more.','https://www.3blue1brown.com/topics/linear-algebra'],['Linear Algebra Done Right · Sheldon Axler','Open textbook site · theoretical perspective; check the edition for section mapping.','https://linear.axler.net/'],['Linear Algebra and Learning from Data · Gilbert Strang','Wellesley-Cambridge Press · applied data analysis and machine learning.','https://math.mit.edu/~gs/learningfromdata/'],['MIT 18.065 · Matrix Methods in Data Analysis','MIT OpenCourseWare · Spring 2018 course materials.','https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/']];
// Deterministic problem bank: 8 templates × 64 parameter sets = 512 unique, exactly solvable items.
function problem(id){let [f,k]=id.slice(1).split('-').map(Number),n=k+2,a=k%8+1,b=Math.floor(k/8)+1,c=(k*5)%7+1,d=(k*2)%5+1;let p={id,topic:topics[f],level:Math.min(9,1+Math.floor(k/7)),time:[2,3,4,5][f%4],answer:'',statement:'',hint:'',solution:'',mistake:'',bio:''};switch(f){case 0:p.statement=`Compute the dot product of u=(${a}, ${b}) and v=(${c}, −${d}).`;p.answer=String(a*c-b*d);p.hint='Multiply corresponding entries, then add.';p.solution=`u·v = ${a}×${c} + ${b}×(−${d}) = ${p.answer}. A positive/negative/zero result indicates an acute/obtuse/right angle when both vectors are nonzero.`;p.mistake='Forgetting the negative sign in the second vector.';break;case 1:p.statement=`For A=[[${a}, ${b}],[${c}, ${d}]] and x=(${b}, ${a}), compute Ax.`;p.answer=`${a*b+b*a},${c*b+d*a}`;p.hint='Take the dot product of each row with x.';p.solution=`Ax=(${a}×${b}+${b}×${a}, ${c}×${b}+${d}×${a})=(${a*b+b*a}, ${c*b+d*a}).`;p.mistake='Multiplying entries in matching positions instead of taking row dot products.';break;case 2:{let x=k%8+1,y=Math.floor(k/8)-3;p.statement=`Solve x+y=${x+y} and x−y=${x-y}. Give (x,y).`;p.answer=`${x},${y}`;p.hint='Add the equations to isolate x.';p.solution=`Adding gives 2x=${2*x}, so x=${x}; substituting gives y=${y}.`;p.mistake='Sign error when substituting into the second equation.';break}case 3:p.statement=`For the diagonal matrix A=diag(${a}, ${-b}), give the eigenvalues and two corresponding unit eigenvectors.`;p.answer=`${a},${-b}`;p.hint='For a diagonal matrix, the coordinate axes are invariant.';p.solution=`A(1,0)=(${a})(1,0) and A(0,1)=(${-b})(0,1). Eigenvalues: ${a} and ${-b}; unit eigenvectors e₁ and e₂.`;p.mistake='Calling diagonal entries eigenvectors; they are eigenvalues.';break;case 4:p.statement=`Project u=(${a}, ${b}) onto v=(${c}, 0). Give the resulting vector.`;p.answer=`${a},0`;p.hint='The projection onto the horizontal axis keeps the horizontal component.';p.solution=`proj_v(u)=((u·v)/(v·v))v=(${a},0), since v is a nonzero horizontal vector.`;p.mistake='Returning a scalar coefficient instead of the projected vector.';break;case 5:p.statement=`A sample has ${a} alternate allele copies among ${2*(a+b)} chromosome copies. What is the allele frequency? Give a decimal rounded to 3 places.`;p.answer=(a/(2*(a+b))).toFixed(3);p.hint='Frequency = alternate copies / total chromosome copies.';p.solution=`p=${a}/${2*(a+b)}=${(a/(2*(a+b))).toFixed(3)}. This is a toy calculation; sampling uncertainty is not represented.`;p.mistake='Dividing by the number of individuals instead of chromosome copies.';p.bio='Population genetics';break;case 6:{let λ1=k+1,λ2=64-k,trace=λ1+λ2,largest=Math.max(λ1,λ2);p.statement=`A centered 2D dataset has covariance C=diag(${λ1}, ${λ2}). What fraction of total variance does PC1 explain? Percent to 1 decimal.`;p.answer=(100*largest/trace).toFixed(1);p.hint='Sum the eigenvalues for total variance; the larger is the first component.';p.solution=`PC1 explains ${largest}/(${λ1}+${λ2})×100 = ${p.answer}%. This assumes the stated covariance matrix and centered observations.`;p.mistake='Using just the largest eigenvalue as a percentage.';p.bio='PCA';break}case 7:p.statement=`Find det([[${a}, ${b}],[${c}, ${d}]]).`;p.answer=String(a*d-b*c);p.hint='For 2×2 matrices, ad−bc.';p.solution=`det(A)=${a}×${d}−${b}×${c}=${p.answer}. Its magnitude is area scaling; sign records orientation.`;p.mistake='Using ad+bc instead of ad−bc.';break}return p}
function getProblem(id){return problem(id)}function nextProblem(){let f=Math.floor(Math.random()*8),k=Math.floor(Math.random()*64);if(arenaMode==='Mistake review'&&state.wrong.length){let id=state.wrong[Math.floor(Math.random()*state.wrong.length)];currentProblem=getProblem(id)}else{let filter=document.getElementById('topicFilter')?.value,lev=document.getElementById('levelFilter')?.value,ix=filter?topics.indexOf(filter):f;if(lev){let tries=0;do{k=Math.floor(Math.random()*64);currentProblem=getProblem('P'+ix+'-'+k);tries++}while(currentProblem.level!==+lev&&tries<100);if(currentProblem.level!==+lev){ix=(+lev-1)%8;k=0}}currentProblem=getProblem('P'+ix+'-'+k)}document.getElementById('problemSlot').innerHTML=problemCard(currentProblem);if(arenaMode==='Timed')startArenaTimer(currentProblem.time)}

state.attempts=state.attempts||[];
const moduleFamilies=[0,0,1,2,1,7,3,3,4,4,6,6,6,1,1,null];
function moduleEvidence(i){const f=moduleFamilies[i],xs=state.attempts.filter(a=>{const family=Number(String(a.id).slice(1).split('-')[0]);return f===null||family===f}),unique=new Set(xs.filter(a=>a.correct).map(a=>a.id)),days=new Set(xs.filter(a=>a.correct).map(a=>a.date)),accuracy=xs.length?xs.filter(a=>a.correct).length/xs.length:0;return{attempts:xs.length,unique:unique.size,days:days.size,accuracy}}
function moduleStatus(i){const e=moduleEvidence(i);if(!e.attempts)return'Not started';if(e.unique>=8&&e.days>=3&&e.accuracy>=.8)return'Mastered';if(e.unique>=5)return'Completed';if(e.attempts>=3)return'Practicing';return'Learning'}
const _checkedAnswer=checkAnswer;checkAnswer=function(){const p=currentProblem,result=MathEngine.validateGenerated(p,document.getElementById('answer').value);_checkedAnswer();state.attempts.push({id:p.id,date:day(),correct:result.ok});state.attempts=state.attempts.slice(-20000);save()};

state.journalEntries=state.journalEntries||[];
views.journal=()=>{const q=window.journalSearch||'',list=state.journalEntries.filter(e=>(e.title+' '+e.category+' '+e.text+' '+e.references).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));const d=window.journalDraft;return `${heading('Research Studio · Journal','Keep the thinking visible','Record derivations, decisions, questions, and references as your project develops.')}${d?`<div class="card"><h2>${d.id?'Edit':'New'} journal entry</h2><input class="field full" id="jTitle" placeholder="Entry title" value="${esc(d.title||'')}"><div class="formrow"><select class="field" id="jCategory"><option>Mathematics</option><option>Research question</option><option>Methods</option><option>Data</option><option>Reflection</option><option>General</option></select><input class="field answer" id="jReferences" placeholder="References / DOI / URL" value="${esc(d.references||'')}"></div><textarea id="jText" class="field full" style="margin-top:9px;min-height:180px" placeholder="What did you derive, decide, or wonder?">${esc(d.text||'')}</textarea><div class="inline-actions" style="margin-top:10px"><button class="btn primary" onclick="saveJournalEntry()">Save entry</button><button class="btn" onclick="window.journalDraft=null;render()">Cancel</button></div></div>`:''}${''}<div class="card"><div class="inline-actions" style="justify-content:space-between"><h2>${list.length} entries</h2><div><input class="field" placeholder="Search journal" value="${esc(q)}" oninput="window.journalSearch=this.value;const q=this.value.toLowerCase();document.querySelectorAll('[data-journal-entry]').forEach(x=>x.hidden=!x.innerText.toLowerCase().includes(q))"><button class="btn primary" onclick="window.journalDraft={};render()">New entry +</button><button class="btn" onclick="exportJournal()">Export</button></div></div>${list.length?list.map(e=>`<details data-journal-entry class="row"><summary class="grow"><strong>${esc(e.title||'Untitled entry')}</strong><small>${esc(e.date)} · ${esc(e.category)}</small></summary><div class="moduledetail"><p>${esc(e.text).replace(/\n/g,'<br>')}</p>${e.references?`<p><b>References:</b> ${esc(e.references)}</p>`:''}<button class="btn sm" onclick="editJournalEntry('${e.id}')">Edit</button> <button class="btn sm" onclick="deleteJournalEntry('${e.id}')">Delete</button></div></details>`).join(''):'<div class="empty">No entries yet. Capture a question or calculation while it is fresh.</div>'}</div>`};
function saveJournalEntry(){const title=document.getElementById('jTitle').value.trim(),text=document.getElementById('jText').value.trim();if(!title||!text){alert('Add a title and entry text before saving.');return}const d=window.journalDraft||{},e={id:d.id||window.crypto?.randomUUID?.()||String(Date.now()),title,category:document.getElementById('jCategory').value,text,references:document.getElementById('jReferences').value.trim(),date:day()};const i=state.journalEntries.findIndex(x=>x.id===e.id);if(i<0)state.journalEntries.push(e);else state.journalEntries[i]=e;window.journalDraft=null;save();render()}
function editJournalEntry(id){window.journalDraft={...state.journalEntries.find(x=>x.id===id)};render()}
function deleteJournalEntry(id){if(!confirm('Delete this journal entry?'))return;state.journalEntries=state.journalEntries.filter(x=>x.id!==id);save();render()}
exportJournal=function(){download('mathematica-research-journal.json',JSON.stringify({legacyNotes:state.journal||'',entries:state.journalEntries||[]},null,2))};
const _navJournal=nav;nav=function(){_navJournal();const n=document.getElementById('nav');if(!n.querySelector('[data-journal]')){const b=document.createElement('button');b.dataset.journal='1';b.className=page==='journal'?'active':'';b.innerHTML='<span class="ico">✎</span><span class="label">Research Journal</span>';b.onclick=()=>setPage('journal');n.appendChild(b)}};
const _renderJournal=render;render=function(){_renderJournal();const crumb=document.getElementById('crumb');if(crumb&&(page==='journal'||page==='exam'))crumb.textContent=page==='journal'?'Research Journal':'Exam Mode';if(page==='exam'&&window.examState&&['active','review'].includes(window.examState.status)){examTick();if(!window.examClock)window.examClock=setInterval(examTick,500)}if(page==='studio'){const m=[...document.querySelectorAll('.metric')].find(x=>x.textContent.includes('JOURNAL ENTRIES'));if(m)m.querySelector('.val').textContent=String(state.journalEntries.length)}};

const _renderBiologyLab=render;render=function(){_renderBiologyLab();if(page==='lab')BiologyLab.render(document.getElementById('view'),download)};

views.courses=()=>CourseUI.catalog(platformState,activeCourseId,heading,esc);
views.knowledge=()=>CourseUI.graph(heading,esc);
function switchCourse(id){if(id===activeCourseId)return;if(window.practiceTimer)stopTimer();save();const selected=CourseEngine.activate(platformState,id);activeCourseId=id;state=selected.progress;state.dark=platformState.preferences.dark;window.examState=state.exam||null;clearInterval(window.examClock);window.examClock=null;page='home';moduleOpen=-1;save();render()}
const _courseNav=nav;nav=function(){_courseNav();const n=document.getElementById('nav');for(const [id,label,icon] of [['courses','Course Catalog','▦'],['knowledge','Knowledge Graph','⌘']])if(!n.querySelector('[data-course-page="'+id+'"]')){const b=document.createElement('button');b.dataset.coursePage=id;b.className=page===id?'active':'';b.innerHTML='<span class="ico">'+icon+'</span><span class="label">'+label+'</span>';b.onclick=()=>setPage(id);n.appendChild(b)}};
const _courseRender=render;render=function(){_courseRender();const selector=document.getElementById('courseSwitcher');if(selector){selector.innerHTML=CourseEngine.registry.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+' · '+CourseUI.label(c.status)+'</option>').join('');selector.value=activeCourseId}const crumb=document.getElementById('crumb');if(crumb){if(page==='courses')crumb.textContent='Course Catalog';if(page==='knowledge')crumb.textContent='Knowledge Graph';if(!CourseEngine.contentAdapter(activeCourseId)&&!['courses','knowledge'].includes(page))crumb.textContent=CourseEngine.get(activeCourseId).name}if(activeCourseId!=='linear-algebra'&&!['courses','knowledge'].includes(page))document.getElementById('view').innerHTML=CourseUI.placeholder(CourseEngine.get(activeCourseId),heading,esc)};

streak=function(){return MathDates.streak(state.activeDays,day())};weekDates=function(){return MathDates.weekDates(day())};
document.getElementById('theme').onclick=()=>{state.dark=!state.dark;save();render()};if(!MathStorage.available())alert('Browser storage is unavailable; learning records will not persist in this session.');if(window.initialLoad.error)alert(window.initialLoad.error);if(window.initialLoad.migrated)save();render();
</script></body></html>
